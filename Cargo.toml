[package]
name = "virtual-mic-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
local-ip-address = "0.6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
tokio-rustls = "0.26.5"
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"
base64 = "0.23.1"
rand = "0.10.3"
hmac = "0.13.0"
sha2 = "0.11.0"
dirs = "7.0.0"
